services:

  credit_auth_db:
    image: postgres:15
    container_name: credit_auth_db
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
      POSTGRES_DB: credit_auth_db
    ports:
      - "5432:5432"
    volumes:
      - credit_auth_data:/var/lib/postgresql/data
    networks:
      - credit_network

  liquibase_auth:
    container_name: liquibase_auth
    image: liquibase/liquibase:4.33-alpine
    command: update --changelog-file=changelog.xml --username=auth_user --password=auth_pass --url=jdbc:postgresql://credit_auth_db:5432/credit_auth_db
    volumes:
      - ./auth/config/changelog.xml:/liquibase/changelog.xml
      - ./auth/scripts:/liquibase/scripts
    networks:
      - credit_network
    depends_on:
      - credit_auth_db

volumes:
  credit_auth_data:

networks:
  credit_network:
    external: true


