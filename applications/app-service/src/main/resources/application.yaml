server:
  port: 9080
spring:
  application:
    name: "CreditYaAuthService"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null

machine:
  client:
    id: "${AUTH_MACHINE_CLIENT_ID}"
    secret: "${AUTH_MACHINE_CLIENT_PASSWORD}"

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true

adapters:
  r2dbc:
    host: "${POSTGRES_HOST}"
    port: "${POSTGRES_PORT}"
    database: "${POSTGRES_DB}"
    schema: "public"
    username: "${POSTGRES_USER}"
    password: "${POSTGRES_PASSWORD}"

cors:
  allowed-origins: "${CORS_ORIGIN_ALLOWED}"

jwt:
  secret: "${JWT_SECRET_KEY}"
  expiration: "${JWT_EXPIRATION}"