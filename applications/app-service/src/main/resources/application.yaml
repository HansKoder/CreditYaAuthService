server:
  port: 9080
spring:
  application:
    name: "CreditYaAuthService"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true

adapters:
  r2dbc:
    host: "${POSTGRES_HOST:localhost}"
    port: "${POSTGRES_PORT:5432}"
    database: "${POSTGRES_DB:credit_auth_db}"
    schema: "public"
    username: "${POSTGRES_USER:auth_user}"
    password: "${POSTGRES_PASSWORD:auth_pass}"

cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

jwt:
  secret: ${SECRET_KEY:uO8lC2VhP3nZ6kF9Q1tWjR7yX5aT2sVb0mGhN8oJzK4cE6rLwBqD3pUyHfMxZaSd}
  expiration: "${EXPIRATION:3600000}"